name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "jaisimha18" ]
  pull_request:
    branches: [ "main", "master", "jaisimha18" ]

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Python Syntax and Code Quality (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,AML_DATASET,outputs
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,__pycache__,AML_DATASET,outputs

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
